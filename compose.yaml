services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: medium_dev
      POSTGRES_USER: medium_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your terminal}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - medium_dev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medium_dev -d medium_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      POSTGRES_DB: medium_dev
      POSTGRES_USER: medium_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your terminal}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy


volumes:
  medium_dev_pgdata:
